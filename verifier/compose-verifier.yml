services:
  minio:
    image: minio/minio:latest
    command: server /data

    environment:
      MINIO_ROOT_USER: student
      MINIO_ROOT_PASSWORD: student123

    mem_limit: 512m

  verifier:
    build:
      dockerfile: Dockerfile.verifier

    ports:
      - "8001:8000"

    depends_on:
      - minio