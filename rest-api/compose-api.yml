# Two services on one user-defined network. Compose creates that network and
# registers each service name in its internal DNS, so "api" resolves from the
# client container without any address being written down anywhere.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    volumes:
      - ./src:/src
    ports:
      - "8000:8000"      # only so YOU can open it in a browser

  client:
    image: python:3.11-slim
    volumes:
      - ./src:/src
    working_dir: /src
    command: ["python", "client.py"]
    depends_on:
      - api
