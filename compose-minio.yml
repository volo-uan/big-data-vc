services:
  minio:
    image: minio/minio:latest

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: student
      MINIO_ROOT_PASSWORD: student123

    ports:
      - "9000:9000"
      - "9001:9001"

    volumes:
      - ./minio-data:/data

    mem_limit: 512m