services:
  serwer:
    image: python:3.11-slim
    command: sh -c "sleep 8; python -m http.server 8000"

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000')"
        ]
      interval: 5s
      timeout: 3s
      retries: 5

  klient:
    image: python:3.11-slim
    depends_on:
      serwer:
        condition: service_healthy

    command: >
      python -c "import urllib.request as u;
      print('status:', u.urlopen('http://serwer:8000').status)"